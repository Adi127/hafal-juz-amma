شَرُّ ٱلۡبَرِيَّةِ","Inna allatheena kafaroo min ahli alkitabi waalmushrikeena fee nari jahannama khalideena feeha olaika hum sharru albariyyati","Sungguh, orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik (akan masuk) ke neraka Jahanam; mereka kekal di dalamnya selama-lamanya. Mereka itu adalah sejahat-jahat makhluk"],["إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ أُوْلَـٰٓئِكَ هُمۡ خَيۡرُ ٱلۡبَرِيَّةِ","Inna allatheena amanoo wa'amiloo alssalihati olaika hum khayru albariyyati","Sungguh, orang-orang yang beriman dan mengerjakan kebajikan, mereka itulah sebaik-baik makhluk"],["جَزَآؤُهُمۡ عِندَ رَبِّهِمۡ جَنَّـٰتُ عَدۡنٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدٗاۖ رَّضِيَ ٱللَّهُ عَنۡهُمۡ وَرَضُواْ عَنۡهُۚ ذَٰلِكَ لِمَنۡ خَشِيَ رَبَّهُۥ","Jazaohum 'inda rabbihim jannatu 'adnin tajree min tahtiha alanharu khalideena feeha abadan radiya Allahu 'anhum waradoo 'anhu thalika liman khashiya rabbahu","Balasan mereka di sisi Tuhan mereka ialah surga 'Ādn yang mengalir di bawahnya sungai-sungai; mereka kekal di dalamnya selama-lamanya. Allah rida terhadap mereka dan mereka pun rida kepada-Nya. Yang demikian itu adalah (balasan) bagi orang yang takut kepada Tuhannya"]]},{"n":99,"ar":"الزلزلة","tr":"Az-Zalzalah","id":"Kegoncangan","v":[["إِذَا زُلۡزِلَتِ ٱلۡأَرۡضُ زِلۡزَالَهَا","Itha zulzilati alardu zilzalaha","Apabila bumi diguncangkan dengan guncangan yang dahsyat"],["وَأَخۡرَجَتِ ٱلۡأَرۡضُ أَثۡقَالَهَا","Waakhrajati alardu athqalaha","dan bumi telah mengeluarkan beban-beban berat (yang dikandung)nya"],["وَقَالَ ٱلۡإِنسَٰنُ مَا لَهَا","Waqala alinsanu ma laha","dan manusia bertanya, \"Apa yang terjadi pada bumi ini"],["يَوۡمَئِذٖ تُحَدِّثُ أَخۡبَارَهَا","Yawmaithin tuhaddithu akhbaraha","Pada hari itu bumi menyampaikan beritanya"],["بِأَنَّ رَبَّكَ أَوۡحَىٰ لَهَا","Bianna rabbaka awha laha","karena sesungguhnya Tuhanmu telah memerintahkan (yang sedemikian itu) padanya"],["يَوۡمَئِذٖ يَصۡدُرُ ٱلنَّاسُ أَشۡتَاتٗا لِّيُرَوۡاْ أَعۡمَٰلَهُمۡ","Yawmaithin yasduru alnnasu ashtatan liyuraw a'malahum","(Pada hari itu manusia keluar dari kuburnya dalam keadaan berkelompok-kelompok,922) untuk diperlihatkan kepada mereka (balasan) semua amal perbuatannya"],["فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ","Faman ya'mal mithqala tharratin khayran yarahu","Maka barangsiapa mengerjakan kebaikan seberat zarah, niscaya dia akan melihat (balasan)nya"],["وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ","Waman ya'mal mithqala tharratin sharran yarahu","Dan barangsiapa mengerjakan kejahatan seberat zarah, niscaya dia akan melihat (balasan)nya"]]},{"n":100,"ar":"العاديات","tr":"Al-'Adiyat","id":"Berlari Kencang","v":[["وَٱلۡعَٰدِيَٰتِ ضَبۡحٗا","Waal'adiyati dabhan","Demi kuda perang yang berlari kencang terengah-engah"],["فَٱلۡمُورِيَٰتِ قَدۡحٗا","Faalmooriyati qadhan","dan kuda yang memercikkan bunga api (dengan pukulan kuku kakinya)"],["فَٱلۡمُغِيرَٰتِ صُبۡحٗا","Faalmugheerati subhan","dan kuda yang menyerang (dengan tiba-tiba) pada waktu pagi"],["فَأَثَرۡنَ بِهِۦ نَقۡعٗا","Faatharna bihi naq'an","sehingga menerbangkan debu"],["فَوَسَطۡنَ بِهِۦ جَمۡعًا","Fawasatna bihi jam'an","lalu menyerbu ke tengah-tengah kumpulan musuh"],["إِنَّ ٱلۡإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٞ","Inna alinsana lirabbihi lakanoodun","sungguh, manusia itu sangat ingkar, (tidak bersyukur) kepada Tuhannya"],["وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٞ","Wainnahu 'ala thalika lashaheedun","dan sesungguhnya dia (manusia) menyaksikan (mengakui) keingkarannya"],["وَإِنَّهُۥ لِحُبِّ ٱلۡخَيۡرِ لَشَدِيدٌ","Wainnahu lihubbi alkhayri lashadeedun","dan sesungguhnya cintanya kepada harta benar-benar berlebihan"],["۞أَفَلَا يَعۡلَمُ إِذَا بُعۡثِرَ مَا فِي ٱلۡقُبُورِ","Afala ya'lamu itha bu'thira ma fee alquboori","Maka tidakkah dia mengetahui apabila apa yang di dalam kubur dikeluarkan"],["وَحُصِّلَ مَا فِي ٱلصُّدُورِ","Wahussila ma fee alssudoori","dan apa yang tersimpan di dalam dada dikeluarkan"],["إِنَّ رَبَّهُم بِهِمۡ يَوۡمَئِذٖ لَّخَبِيرُۢ","Inna rabbahum bihim yawmaithin lakhabeerun","sungguh, Tuhan mereka pada hari itu Mahateliti terhadap keadaan mereka"]]},{"n":101,"ar":"القارعة","tr":"Al-Qari'ah","id":"Hari Kiamat","v":[["ٱلۡقَارِعَةُ","Alqari'atu","Hari Kiamat"],["مَا ٱلۡقَارِعَةُ","Ma alqari'atu","Apakah hari Kiamat itu"],["وَمَآ أَدۡرَىٰكَ مَا ٱلۡقَارِعَةُ","Wama adraka ma alqari'atu","Dan tahukah kamu apakah hari Kiamat itu"],["يَوۡمَ يَكُونُ ٱلنَّاسُ كَٱلۡفَرَاشِ ٱلۡمَبۡثُوثِ","Yawma yakoonu alnnasu kaalfarashi almabthoothi","Pada hari itu manusia seperti laron yang beterbangan"],["وَتَكُونُ ٱلۡجِبَالُ كَٱلۡعِهۡنِ ٱلۡمَنفُوشِ","Watakoonu aljibalu kaal'ihni almanfooshi","dan gunung-gunung seperti bulu yang dihambur-hamburkan"],["فَأَمَّا مَن ثَقُلَتۡ مَوَٰزِينُهُۥ","Faamma man thaqulat mawazeenuhu","Maka adapun orang yang berat timbangan (kebaikan)nya"],["فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ","Fahuwa fee 'eeshatin radiyatin","maka dia berada dalam kehidupan yang memuaskan (senang)"],["وَأَمَّا مَنۡ خَفَّتۡ مَوَٰزِينُهُۥ","Waamma man khaffat mawazeenuhu","Dan adapun orang yang ringan timbangan (kebaikan)nya"],["فَأُمُّهُۥ هَاوِيَةٞ","Faommuhu hawiyatun","maka tempat kembalinya adalah neraka Hāwiyah"],["وَمَآ أَدۡرَىٰكَ مَا هِيَهۡ","Wama adraka ma hiyah","Dan tahukah kamu apakah neraka Hāwiyah itu"],["نَارٌ حَامِيَةُۢ","Narun hamiyatun","(Yaitu) api yang sangat panas"]]},{"n":102,"ar":"التكاثر","tr":"At-Takathur","id":"Bermegah-megahan","v":[["أَلۡهَىٰكُمُ ٱلتَّكَاثُرُ","Alhakumu alttakathuru","Bermegah-megahan telah melalaikan kamu"],["حَتَّىٰ زُرۡتُمُ ٱلۡمَقَابِرَ","Hatta zurtumu almaqabira","sampai kamu masuk ke dalam kubur"],["كَلَّا سَوۡفَ تَعۡلَمُونَ","Kalla sawfa ta'lamoona","Sekali-kali tidak! Kelak kamu akan mengetahui (akibat perbuatanmu itu)"],["ثُمَّ كَلَّا سَوۡفَ تَعۡلَمُونَ","Thumma kalla sawfa ta'lamoona","kemudian sekali-kali tidak! Kelak kamu akan mengetahui"],["كَلَّا لَوۡ تَعۡلَمُونَ عِلۡمَ ٱلۡيَقِينِ","Kalla law ta'lamoona 'ilma alyaqeeni","Sekali-kali tidak! Sekiranya kamu mengetahui dengan pasti"],["لَتَرَوُنَّ ٱلۡجَحِيمَ","Latarawunna aljaheema","niscaya kamu benar-benar akan melihat neraka Jahim"],["ثُمَّ لَتَرَوُنَّهَا عَيۡنَ ٱلۡيَقِينِ","Thumma latarawunnaha 'ayna alyaqeeni","kemudian kamu benar-benar akan melihatnya dengan mata kepala sendiri"],["ثُمَّ لَتُسۡـَٔلُنَّ يَوۡمَئِذٍ عَنِ ٱلنَّعِيمِ","Thumma latusalunna yawmaithin 'ani alnna'eemi","kemudian kamu benar-benar akan ditanya pada hari itu tentang kenikmatan (yang megah di dunia itu)"]]},{"n":103,"ar":"العصر","tr":"Al-'Asr","id":"Waktu Sore","v":[["وَٱلۡعَصۡرِ","Waal'asri","Demi masa"],["إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ","Inna alinsana lafee khusrin","Sungguh, manusia berada dalam kerugian"],["إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ","Illa allatheena amanoo wa'amiloo alssalihati watawasaw bialhaqqi watawasaw bialssabri","kecuali orang-orang yang beriman dan mengerjakan kebajikan serta saling menasihati untuk kebenaran dan saling menasihati untuk kesabaran"]]},{"n":104,"ar":"الهمزة","tr":"Al-Humazah","id":"Pengumpat","v":[["وَيۡلٞ لِّكُلِّ هُمَزَةٖ لُّمَزَةٍ","Waylun likulli humazatin lumazatin","Celakalah bagi setiap pengumpat dan pencela"],["ٱلَّذِي جَمَعَ مَالٗا وَعَدَّدَهُۥ","Allathee jama'a malan wa'addadahu","yang mengumpulkan harta dan menghitung-hitungnya"],["يَحۡسَبُ أَنَّ مَالَهُۥٓ أَخۡلَدَهُۥ","Yahsabu anna malahu akhladahu","dia (manusia) mengira bahwa hartanya itu dapat mengekalkannya"],["كَلَّاۖ لَيُنۢبَذَنَّ فِي ٱلۡحُطَمَةِ","Kalla layunbathanna fee alhutamati","Sekali-kali tidak! Pasti dia akan dilemparkan ke dalam (neraka) Ḥuṭamah"],["وَمَآ أَدۡرَىٰكَ مَا ٱلۡحُطَمَةُ","Wama adraka ma alhutamatu","Dan tahukah kamu apakah (neraka) Ḥuṭamah itu"],["نَارُ ٱللَّهِ ٱلۡمُوقَدَةُ","Naru Allahi almooqadatu","(Yaitu) api (azab) Allah yang dinyalakan"],["ٱلَّتِي تَطَّلِعُ عَلَى ٱلۡأَفۡـِٔدَةِ","Allatee tattali'u 'ala alafidati","yang (membakar) sampai ke hati"],["إِنَّهَا عَلَيۡهِم مُّؤۡصَدَةٞ","lnnaha 'alayhim musadatun","Sungguh, api itu ditutup rapat atas (diri) mereka"],["فِي عَمَدٖ مُّمَدَّدَةِۭ","Fee 'amadin mumaddadatin","(sedang mereka itu) diikat pada tiang-tiang yang panjang"]]},{"n":105,"ar":"الفيل","tr":"Al-Fil","id":"Gajah","v":[["أَلَمۡ تَرَ كَيۡفَ فَعَلَ رَبُّكَ بِأَصۡحَٰبِ ٱلۡفِيلِ","Alam tara kayfa fa'ala rabbuka biashabi alfeeli","Tidakkah engkau (Muhammad) perhatikan bagaimana Tuhanmu telah bertindak terhadap pasukan bergajah"],["أَلَمۡ يَجۡعَلۡ كَيۡدَهُمۡ فِي تَضۡلِيلٖ","Alam yaj'al kaydahum fee tadleelin","Bukankah Dia telah menjadikan tipu daya mereka itu sia-sia"],["وَأَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا أَبَابِيلَ","Waarsala 'alayhim tayran ababeela","dan Dia mengirimkan kepada mereka burung yang berbondong-bondong"],["تَرۡمِيهِم بِحِجَارَةٖ مِّن سِجِّيلٖ","Tarmeehim bihijaratin min sijjeelin","yang melempari mereka dengan batu dari tanah liat yang dibakar"],["فَجَعَلَهُمۡ كَعَصۡفٖ مَّأۡكُولِۭ","Faja'alahum ka'asfin makoolin","sehingga mereka dijadikan-Nya seperti daun-daun yang dimakan (ulat)"]]},{"n":106,"ar":"قريش","tr":"Quraysh","id":"Suku Quraisy","v":[["لِإِيلَٰفِ قُرَيۡشٍ","Lieelafi qurayshin","Karena kebiasaan orang-orang Quraisy"],["إِۦلَٰفِهِمۡ رِحۡلَةَ ٱلشِّتَآءِ وَٱلصَّيۡفِ","Eelafihim rihlata alshshitai waalssayfi","(yaitu) kebiasaan mereka bepergian pada musim dingin dan musim panas"],["فَلۡيَعۡبُدُواْ رَبَّ هَٰذَا ٱلۡبَيۡتِ","Falya'budoo rabba hatha albayti","Maka hendaklah mereka menyembah Tuhan (pemilik) rumah ini (Ka'bah)"],["ٱلَّذِيٓ أَطۡعَمَهُم مِّن جُوعٖ وَءَامَنَهُم مِّنۡ خَوۡفِۭ","Allathee at'amahum min joo'in waamanahum min khawfin","yang telah memberi makanan kepada mereka untuk menghilangkan lapar dan mengamankan mereka dari rasa ketakutan"]]},{"n":107,"ar":"الماعون","tr":"Al-Ma'un","id":"Barang yang Berguna","v":[["أَرَءَيۡتَ ٱلَّذِي يُكَذِّبُ بِٱلدِّينِ","Araayta allathee yukaththibu bialddeeni","Tahukah kamu (orang) yang mendustakan agama"],["فَذَٰلِكَ ٱلَّذِي يَدُعُّ ٱلۡيَتِيمَ","Fathalika allathee yadu''u alyateema","Maka itulah oran const INTERVALS=[1,3,7,14,30,60];
function buildPlan(mode,from,to,n){
  const out=[],r=[];
  for(let a=from;a<=to;a++)r.push(a);
  if(mode==='ayat'){
    r.forEach((a,i)=>{for(let k=1;k<=n;k++)out.push({a,rep:k,of:n,step:i+1,steps:r.length})});
  }else if(mode==='rentang'){
    for(let k=1;k<=n;k++)r.forEach(a=>out.push({a,rep:k,of:n,step:1,steps:1}));
  }else{
    for(let st=1;st<=r.length;st++)for(let k=1;k<=n;k++)r.slice(0,st).forEach(a=>out.push({a,rep:k,of:n,step:st,steps:r.length}));
  }
  return out;
}
function dayStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function daysSince(ts,now){return Math.round((dayStart(now)-dayStart(ts))/86400000)}
function dueIn(m,now){return INTERVALS[Math.min(m.lvl,INTERVALS.length-1)]-daysSince(m.last,now)}
function dueGroups(mem,now,data){
  const groups=[];
  for(const s of data){
    let cur=null;
    for(let a=1;a<=s.v.length;a++){
      const m=mem[s.n+':'+a];
      if(m&&dueIn(m,now)<=0){
        const d=daysSince(m.last,now);
        if(cur&&cur.to===a-1){cur.to=a;cur.old=Math.max(cur.old,d)}
        else{cur={s:s.n,from:a,to:a,old:d};groups.push(cur)}
      }else cur=null;
    }
  }
  return groups;
}
function nextDue(mem,now){
  let best=null;
  for(const k in mem){const d=dueIn(mem[k],now);if(d>0&&(best===null||d<best))best=d}
  return best;
}

/* ---------- pemutar ---------- */
const audio=new Audio();audio.preload='auto';
const pre=new Audio();pre.preload='auto';
const P={plan:[],i:0,state:'idle',s:null,from:1,to:1,mode:'ayat',timer:0,err:'',shown:0,resume:'',tok:0};
const url=(q,s,a)=>`https://everyayah.com/data/${q}/${pad(s)}${pad(a)}.mp3`;

/* ---------- audio offline ---------- */
const HAS_CACHE=typeof caches!=='undefined';
const AC=q=>'hafal-audio-'+q;
const OFF={};
const D={q:'',state:'idle',done:0,total:0,fail:0,abort:false,msg:'',del:'',storage:''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const offCount=q=>OFF[q]?OFF[q].size:0;
const isOff=(q,s,a)=>!!(OFF[q]&&OFF[q].has(mk(s,a)));
async function refreshOff(q){
  const set=new Set();
  try{
    if(HAS_CACHE&&await caches.has(AC(q))){
      const c=await caches.open(AC(q));
      for(const r of await c.keys()){const m=r.url.match(/\/(\d{3})(\d{3})\.mp3$/);if(m)set.add(mk(+m[1],+m[2]))}
    }
  }catch(e){}
  OFF[q]=set;
  if(V.s!==null&&$('#planInfo'))syncPanel();
}
async function refreshStorage(){
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      D.storage=`Ruang terpakai aplikasi ini ${Math.round((e.usage||0)/1048576)} MB dari sekitar ${Math.round((e.quota||0)/1048576)} MB yang boleh dipakai.`;
    }
  }catch(err){}
}
async function srcFor(q,s,a){
  const u=url(q,s,a);
  try{
    const c=await caches.open(AC(q)),r=await c.match(u);
    if(r)return{src:URL.createObjectURL(await r.blob()),blob:true};
  }catch(e){}
  return{src:u,blob:false};
}
function setSrc(el,o){
  if(el._u){URL.revokeObjectURL(el._u);el._u=''}
  if(o.blob)el._u=o.src;
  el.src=o.src;
}
function freeAudio(){if(audio._u){URL.revokeObjectURL(audio._u);audio._u=''}}
async function dlRun(q){
  if(D.state==='running')return;
  if(!HAS_CACHE){D.state='error';D.msg='Browser ini belum mendukung penyimpanan offline.';paintDl(true);return}
  Object.assign(D,{q,state:'running',done:0,total:TOTAL,fail:0,abort:false,msg:'',del:''});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  paintDl(true);
  await refreshOff(q);
  const have=OFF[q],todo=[];
  DATA.forEach(s=>s.v.forEach((_,i)=>{if(!have.has(mk(s.n,i+1)))todo.push([s.n,i+1])}));
  D.done=TOTAL-todo.length;
  let c;
  try{c=await caches.open(AC(q))}
  catch(e){D.state='error';D.msg='Penyimpanan tidak bisa dibuka di browser ini.';paintDl(true);return}
  let idx=0;
  async function worker(){
    while(!D.abort){
      const j=idx++;if(j>=todo.length)return;
      const n=todo[j][0],a=todo[j][1],u=url(q,n,a);
      let ok=false;
      for(let t=0;t<3&&!ok&&!D.abort;t++){
        try{
          const r=await fetch(u);
          if(!r.ok){if(r.status===404)break;throw new Error('http')}
          await c.put(u,r);ok=true;
        }catch(e){
          if(e&&e.name==='QuotaExceededError'){D.abort=true;D.state='quota';break}
          if(navigator.onLine===false){D.abort=true;D.state='offline';break}
          await sleep(500*(t+1));
        }
      }
      if(ok){have.add(mk(n,a));D.done++}else if(!D.abort)D.fail++;
      paintDl(false);
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  if(D.state==='running')D.state=D.abort?'canceled':(D.fail?'partial':'done');
  await refreshStorage();
  paintDl(true);
  if(V.s!==null&&$('#planInfo'))syncPanel();
}
async function dlRemove(q){
  try{if(HAS_CACHE)await caches.delete(AC(q))}catch(e){}
  OFF[q]=new Set();D.del='';
  if(D.q===q&&D.state!=='running')D.state='idle';
  await refreshStorage();
  paintDl(true);
  if(V.s!==null&&$('#planInfo'))syncPanel();
}
function dlMsg(){
  const m={
    done:'Selesai. Audio tersimpan di HP ini.',
    canceled:'Dibatalkan. Ayat yang sudah terunduh tetap tersimpan.',
    quota:'Ruang penyimpanan penuh. Hapus unduhan lain atau kosongkan ruang di HP, lalu lanjutkan.',
    offline:'Tidak ada koneksi. Sambungkan internet lalu tekan Lanjutkan unduh.',
    partial:`${D.fail} ayat gagal diunduh. Tekan Lanjutkan unduh untuk mencoba lagi.`
  };
  return D.msg||m[D.state]||'';
}
function dlHTML(){
  const rows=QARI.map(q=>{
    const n=offCount(q.id),run=D.state==='running'&&D.q===q.id;
    let st;
    if(run)st=`Mengunduh ${D.done} dari ${D.total} ayat`;
    else if(n>=TOTAL)st=`Tersimpan, ${TOTAL} ayat`;
    else if(n>0)st=`${n} dari ${TOTAL} ayat tersimpan`;
    else st=`Belum diunduh, sekitar ${q.mb} MB`;
    const pct=run?D.done/D.total:n/TOTAL;
    let btns='';
    if(run)btns=`<button type="button" class="btn quiet small" data-act="dlCancel">Batal</button>`;
    else{
      if(n<TOTAL)btns+=`<button type="button" class="btn primary small" data-act="dlStart" data-q="${q.id}"${D.state==='running'?' disabled':''}>${n>0?'Lanjutkan unduh':`Unduh (${q.mb} MB)`}</button>`;
      if(n>0)btns+=D.del===q.id
        ?`<button type="button" class="btn danger small" data-act="dlDel" data-q="${q.id}">Yakin hapus?</button>`
        :`<button type="button" class="btn quiet small" data-act="dlDel" data-q="${q.id}">Hapus</button>`;
    }
    return `<li class="grp" data-q="${q.id}"><div><strong>${q.name}</strong><span class="dlmeta">${st}</span></div>${meter(pct)}<div class="gbtns">${btns}</div></li>`;
  }).join('');
  return `<p class="desc">Simpan murottal di HP supaya bisa diputar tanpa internet, termasuk di mode pesawat. Unduh satu qari yang paling sering dipakai, sebaiknya lewat Wi-Fi.</p>
  <ul class="grps" id="dlList" style="margin-top:14px">${rows}</ul>
  <p class="dlmsg" id="dlMsg" role="status">${dlMsg()}</p>
  <p class="dlstore" id="dlStore">${D.storage||''}</p>`;
}
function paintDl(full){
  const box=$('#dlBox');if(!box)return;
  if(full){box.innerHTML=dlHTML();return}
  const li=box.querySelector(`li[data-q="${D.q}"]`);if(!li)return;
  const s=li.querySelector('.dlmeta'),i=li.querySelector('.meter i');
  if(s)s.textContent=`Mengunduh ${D.done} dari ${D.total} ayat`;
  if(i)i.style.width=Math.round(D.done/D.total*100)+'%';
}
function statusText(it){
  const s=surah(P.s);let t=`${s.tr} ayat ${it.a}`,d='';
  if(P.mode==='ayat')d=`ulangan ${it.rep} dari ${it.of}`;
  else if(P.mode==='rentang')d=`putaran ${it.rep} dari ${it.of}`;
  else d=`tahap ${it.step} dari ${it.steps}, putaran ${it.rep} dari ${it.of}`;
  return [t,d];
}
function gapMs(){
  if(S.gap==='len')return isFinite(audio.duration)?audio.duration/S.rate*1000:2000;
  return Number(S.gap)*1000;
}
function startPlay(){
  closeTry();P.mode=S.mode;P.s=V.s;P.from=R.from;P.to=R.to;P.plan=buildPlan(S.mode,R.from,R.to,S.reps);P.err='';P.shown=0;
  if(!P.plan.length)return;
  playAt(0);
}
function playAt(i){
  clearTimeout(P.timer);
  if(i<0)i=0;
  if(i>=P.plan.length){finish();return}
  P.i=i;P.state='playing';P.err='';
  const it=P.plan[i],tok=++P.tok,q=S.qari,nx=P.plan[i+1];
  const go=o=>{
    if(tok!==P.tok)return;
    setSrc(audio,o);
    audio.defaultPlaybackRate=S.rate;audio.playbackRate=S.rate;
    try{audio.preservesPitch=true}catch(e){}
    if(P.state==='playing'){const pr=audio.play();if(pr&&pr.catch)pr.catch(onAudioError)}
    if(nx&&nx.a!==it.a&&!isOff(q,P.s,nx.a))pre.src=url(q,P.s,nx.a);
  };
  if(isOff(q,P.s,it.a))srcFor(q,P.s,it.a).then(go);else go({src:url(q,P.s,it.a),blob:false});
  paint();
}
function onAudioError(){
  if(P.state==='idle'||P.err)return;
  clearTimeout(P.timer);
  P.state='idle';
  P.err=navigator.onLine===false?'Tidak ada internet dan ayat ini belum diunduh. Buka tab Offline untuk mengunduh audio qari ini.':'Audio tidak bisa dimuat. Periksa koneksi internet, atau unduh audio di tab Offline.';
  paint();
}
audio.addEventListener('error',onAudioError);
audio.addEventListener('ended',()=>{
  if(P.state!=='playing')return;
  const next=P.i+1;
  if(next>=P.plan.length){finish();return}
  const g=gapMs();
  if(g>0){P.state='gap';P.timer=setTimeout(()=>playAt(next),g)}else playAt(next);
});
function pause(){
  if(P.state==='playing'){audio.pause();P.state='paused';P.resume='audio'}
  else if(P.state==='gap'){clearTimeout(P.timer);P.state='paused';P.resume='next'}
  paint();
}
function resume(){
  if(P.state!=='paused')return;
  if(P.resume==='next')playAt(P.i+1);
  else{P.state='playing';const pr=audio.play();if(pr&&pr.catch)pr.catch(onAudioError);paint()}
}
function stop(){
  clearTimeout(P.timer);P.state='idle';P.err='';
  audio.pause();audio.removeAttribute('src');P.tok++;freeAudio();
  P.plan=[];paint();
}
function finish(){
  clearTimeout(P.timer);P.state='idle';audio.pause();P.tok++;freeAudio();P.plan=[];paint();
}
function paint(){
  const bar=$('#bar'),active=P.state!=='idle'&&P.plan.length>0;
  bar.hidden=!(active||P.err);
  if(active){
    const it=P.plan[P.i],[a,b]=statusText(it);
    $('#barText').innerHTML=`${a}<small>${b}${P.state==='gap'?', jeda':''}</small>`;
    const playing=P.state==='playing'||P.state==='gap';
    const t=$('#barToggle');t.innerHTML=playing?ICON.pause:ICON.play;t.setAttribute('aria-label',playing?'Jeda':'Lanjutkan');
  }else $('#barText').textContent='';
  $('#barErr').textContent=P.err||'';
  document.querySelectorAll('.row.now').forEach(r=>r.classList.remove('now'));
  if(active&&V.s===P.s){
    const a=P.plan[P.i].a,r=$('#r'+a);
    if(r){r.classList.add('now');if(P.shown!==a){P.shown=a;r.scrollIntoView({block:'center',behavior:reduce()?'auto':'smooth'})}}
  }
  syncGo();
}

/* ---------- tirukan dan bandingkan ---------- */
const T={a:0,state:'idle',rec:null,stream:null,chunks:[],url:'',timer:0,t0:0,exTok:0};
const exA=new Audio(),mineA=new Audio();
let seqTimer=0;
function tryMsg(m,bad){const e=$('#tryMsg');if(e){e.textContent=m||'';e.style.color=bad?'var(--bad)':''}}
function tryStopAudio(){clearTimeout(seqTimer);T.exTok++;exA.pause();mineA.pause()}
function closeTry(){
  tryStopAudio();
  if(T.rec&&T.rec.state!=='inactive'){try{T.rec.onstop=null;T.rec.stop()}catch(e){}}
  if(T.stream){T.stream.getTracks().forEach(x=>x.stop());T.stream=null}
  clearInterval(T.timer);
  if(T.url){URL.revokeObjectURL(T.url);T.url=''}
  const p=$('#try');if(p)p.remove();
  document.querySelectorAll('[data-act="try"][aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));
  T.a=0;T.state='idle';T.rec=null;T.chunks=[];
}
function tryHTML(){
  return `<div class="try" id="try">
    <p class="desc">Dengarkan contoh, rekam bacaanmu, lalu bandingkan. Untuk menguji hafalan, sembunyikan teks dulu.</p>
    <div class="rowbtns"><button type="button" class="btn quiet small" data-act="tryEx">Dengarkan contoh</button>
      <button type="button" class="btn quiet small" data-act="tryBlind">Uji tanpa teks</button></div>
    <div class="rowbtns"><button type="button" class="btn primary small" id="tryRecBtn" data-act="tryRec"></button></div>
    <div class="rowbtns" id="tryAfter" hidden><button type="button" class="btn quiet small" data-act="tryMine">Putar rekamanmu</button>
      <button type="button" class="btn primary small" data-act="tryBoth">Bandingkan</button></div>
    <p class="msg" id="tryMsg" role="status"></p></div>`;
}
function syncTry(){
  const b=$('#tryRecBtn');if(!b)return;
  const rec=T.state==='recording';
  b.classList.toggle('recording',rec);b.classList.toggle('primary',!rec);
  if(rec){const s=Math.floor((Date.now()-T.t0)/1000);b.innerHTML=`<span class="dot"></span> Berhenti ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
  else if(T.state==='stopping')b.textContent='Menyimpan';
  else b.innerHTML=`<span class="dot"></span> ${T.state==='ready'?'Rekam ulang':'Rekam'}`;
  $('#tryAfter').hidden=T.state!=='ready';
}
function openTry(b,a){
  closeTry();stop();T.a=a;
  b.setAttribute('aria-pressed','true');
  $('#r'+a).insertAdjacentHTML('beforeend',tryHTML());
  syncTry();
}
function playEx(rate,then){
  tryStopAudio();
  const a=T.a,q=S.qari,tok=++T.exTok;
  exA.onended=then||null;
  exA.onerror=()=>tryMsg(navigator.onLine===false?'Tidak ada internet dan audio ini belum diunduh.':'Audio contoh tidak bisa dimuat. Periksa koneksi internet.',true);
  const go=o=>{
    if(tok!==T.exTok)return;
    setSrc(exA,o);exA.defaultPlaybackRate=rate;exA.playbackRate=rate;
    const p=exA.play();if(p&&p.catch)p.catch(()=>tryMsg('Audio contoh tidak bisa diputar.',true));
  };
  if(isOff(q,V.s,a))srcFor(q,V.s,a).then(go);else go({src:url(q,V.s,a),blob:false});
}
function playMine(){
  mineA.currentTime=0;mineA.onended=null;
  const p=mineA.play();if(p&&p.catch)p.catch(()=>tryMsg('Rekaman tidak bisa diputar di sini.',true));
}
async function startRec(){
  tryStopAudio();
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||typeof MediaRecorder==='undefined'){
    tryMsg('Perekaman tidak tersedia di browser atau halaman ini. Coba buka versi file HTML di Chrome.',true);return;
  }
  try{T.stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){
    tryMsg(e&&e.name==='NotFoundError'?'Mikrofon tidak ditemukan di perangkat ini.':'Akses mikrofon ditolak. Izinkan mikrofon untuk halaman ini, atau buka versi file HTML di Chrome.',true);return;
  }
  if(!$('#try')){T.stream.getTracks().forEach(x=>x.stop());T.stream=null;return}
  if(T.url){URL.revokeObjectURL(T.url);T.url=''}
  T.chunks=[];
  const rec=new MediaRecorder(T.stream);T.rec=rec;
  rec.ondataavailable=e=>{if(e.data&&e.data.size)T.chunks.push(e.data)};
  rec.onstop=()=>{
    clearInterval(T.timer);
    if(T.stream){T.stream.getTracks().forEach(x=>x.stop());T.stream=null}
    if(!T.chunks.length){T.state='idle';syncTry();tryMsg('Rekaman kosong. Coba lagi.',true);return}
    T.url=URL.createObjectURL(new Blob(T.chunks,{type:rec.mimeType||'audio/webm'}));
    mineA.src=T.url;T.state='ready';syncTry();tryMsg('Rekaman siap. Tekan Bandingkan.');
  };
  rec.start();T.state='recording';T.t0=Date.now();
  T.timer=setInterval(()=>{syncTry();if(Date.now()-T.t0>=60000)stopRec()},500);
  syncTry();tryMsg('');
}
function stopRec(){if(T.rec&&T.state==='recording'){T.state='stopping';syncTry();T.rec.stop()}}

/* ---------- aksi ---------- */
function clampReps(v){return Math.max(1,Math.min(50,v))}
function setMem(s,a,on){
  const k=mk(s,a),now=Date.now();
  if(on){if(!saved.mem[k])saved.mem[k]={at:now,last:now,lvl:0}}else delete saved.mem[k];
}
function openSurah(n,from,to){
  V.s=n;R.from=from||1;R.to=to||surah(n).v.length;
  render();window.scrollTo(0,0);
}
function groupEach(b,fn){
  const s=+b.dataset.s,f=+b.dataset.from,t=+b.dataset.to;
  for(let a=f;a<=t;a++){const m=saved.mem[mk(s,a)];if(m)fn(m)}
}
const ACT={
  install(){if(deferredInstall){const d=deferredInstall;deferredInstall=null;const ib=$('#install');if(ib)ib.hidden=true;d.prompt()}},
  tab(b){
    V.tab=b.dataset.v;render();
    if(V.tab==='dl'){
      Promise.all(QARI.map(q=>(D.state==='running'&&D.q===q.id)?0:refreshOff(q.id))).then(refreshStorage).then(()=>paintDl(true));
    }
  },
  dlStart(b){dlRun(b.dataset.q)},
  dlCancel(){D.abort=true},
  dlDel(b){
    const q=b.dataset.q;
    if(D.del===q){dlRemove(q);return}
    D.del=q;paintDl(true);
    setTimeout(()=>{if(D.del===q){D.del='';paintDl(true)}},4000);
  },
  sort(b){S.sort=b.dataset.v;save();render()},
  open(b){openSurah(+b.dataset.s)},
  back(){V.s=null;render();window.scrollTo(0,0)},
  openPlaying(){if(P.s!==null&&V.s!==P.s)openSurah(P.s,P.from,P.to)},
  mode(b){S.mode=b.dataset.v;save();syncPanel()},
  repDec(){S.reps=clampReps(S.reps-1);save();syncPanel()},
  repInc(){S.reps=clampReps(S.reps+1);save();syncPanel()},
  repSet(b){S.reps=clampReps(+b.dataset.v);save();syncPanel()},
  rate(b){S.rate=Number(b.dataset.v);save();audio.playbackRate=S.rate;audio.defaultPlaybackRate=S.rate;syncPanel()},
  layer(b){const k=b.dataset.v;S.layers[k]=!S.layers[k];b.setAttribute('aria-pressed',String(S.layers[k]));save();syncRowsClass()},
  go(){
    if(P.s===V.s&&(P.state==='playing'||P.state==='gap'))pause();
    else if(P.s===V.s&&P.state==='paused')resume();
    else startPlay();
  },
  markRange(){for(let a=R.from;a<=R.to;a++)setMem(V.s,a,true);save();syncMem()},
  playfrom(b){
    const a=+b.dataset.a;R.from=a;if(R.to<a)R.to=a;
    $('#selFrom').value=R.from;$('#selTo').value=R.to;syncPanel();startPlay();
  },
  mem(b){const a=+b.dataset.a,k=mk(V.s,a);setMem(V.s,a,!saved.mem[k]);save();syncMem()},
  peek(b){const r=b.closest('.row');if(r)r.classList.toggle('peek')},
  gplay(b){openSurah(+b.dataset.s,+b.dataset.from,+b.dataset.to);startPlay()},
  gdone(b){const now=Date.now();groupEach(b,m=>{m.lvl=Math.min(m.lvl+1,INTERVALS.length-1);m.last=now});save();render()},
  gdoubt(b){const now=Date.now();groupEach(b,m=>{m.lvl=0;m.last=now});save();render()},
  bkMake(){
    const t=$('#bk');t.value=JSON.stringify({v:1,mem:saved.mem});t.focus();t.select();
    let msg='Kode dibuat. Salin teks di atas.';
    try{navigator.clipboard.writeText(t.value).then(()=>{$('#bkMsg').textContent='Kode dibuat dan disalin.'}).catch(()=>{})}catch(e){}
    $('#bkMsg').textContent=msg;
  },
  bkLoad(){
    const out=$('#bkMsg');
    try{
      const o=JSON.parse($('#bk').value),m=o&&o.mem;let n=0;
      if(!m||typeof m!=='object')throw new Error('x');
      for(const k in m){
        const v=m[k];
        if(!/^\d+:\d+$/.test(k)||!v||!isFinite(v.at)||!isFinite(v.last)||!isFinite(v.lvl))continue;
        const cur=saved.mem[k];
        if(!cur||v.last>cur.last){saved.mem[k]={at:+v.at,last:+v.last,lvl:Math.max(0,Math.min(INTERVALS.length-1,Math.round(v.lvl)))};n++}
      }
      save();out.textContent=`Berhasil memulihkan ${n} ayat.`;
    }catch(e){out.textContent='Kode tidak valid. Pastikan seluruh teks tersalin.'}
  },
  try(b){const a=+b.dataset.a;if(T.a===a)closeTry();else openTry(b,a)},
  tryEx(){tryMsg('');playEx(S.rate)},
  tryRec(){if(T.state==='recording')stopRec();else startRec()},
  tryMine(){tryStopAudio();tryMsg('');playMine()},
  tryBoth(){tryMsg('Contoh dulu, lalu rekamanmu.');playEx(1,()=>{seqTimer=setTimeout(playMine,500)})},
  tryBlind(){
    S.layers={ar:false,tl:false,id:false};save();syncRowsClass();
    document.querySelectorAll('[data-act="layer"]').forEach(x=>x.setAttribute('aria-pressed','false'));
    document.querySelectorAll('.row.peek').forEach(r=>r.classList.remove('peek'));
    tryMsg('Teks disembunyikan. Tekan Tampilkan di atas untuk memunculkannya lagi.');
  },
  pPrev(){if(P.state!=='idle')playAt(P.i-1)},
  pNext(){if(P.state!=='idle')playAt(P.i+1)},
  pToggle(){if(P.state==='paused')resume();else if(P.state==='playing'||P.state==='gap')pause()},
  pStop(){stop()}
};
const BIND={
  from(t){R.from=+t.value;if(R.to<R.from){R.to=R.from;$('#selTo').value=R.to}syncPanel()},
  to(t){R.to=+t.value;if(R.from>R.to){R.from=R.to;$('#selFrom').value=R.from}syncPanel()},
  gap(t){S.gap=t.value;save()},
  qari(t){S.qari=t.value;save();refreshOff(S.qari);syncPanel()}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.txt')){e.preventDefault();ACT.peek(e.target)}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.bind&&BIND[t.dataset.bind])BIND[t.dataset.bind](t);
});
refreshOff(S.qari);
render();
})();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){try{navigator.serviceWorker.register('./sw.js')}catch(e){}});
}
</script>
